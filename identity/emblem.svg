<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Fractal Pulse emblem: a mathematical sculpture on a pedestal">
  <title>Fractal Pulse — mathematical matter</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9d0ff"/><stop offset="1" stop-color="#8f7cf0"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="50%"><stop offset="0" stop-color="#ffb454" stop-opacity=".28"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="240" height="280" fill="#0f0e15"/>
  <circle cx="120" cy="116" r="104" fill="url(#halo)"/>
  <g fill="none" stroke="#b9a8ff" stroke-opacity=".28"><circle cx="120" cy="116" r="92"/><circle cx="120" cy="116" r="76" stroke-dasharray="2 5"/></g>
  <!-- Menger-style sculpture: level-1 sponge face grid (8 of 9 cells, centre removed), drawn as an isometric cube -->
  <g transform="translate(120 112)" stroke="#14121b" stroke-width=".8" stroke-linejoin="round">
    <g id="cube">
      <path d="M0-62 54-31 0 0-54-31Z" fill="#e6e0ff"/><path d="M-54-31 0 0 0 62-54 31Z" fill="url(#g)"/><path d="M54-31 0 0 0 62 54 31Z" fill="#6c5bd0"/>
    </g>
    <!-- carved voids -->
    <path d="M-18-31 0-21 18-31 0-41Z" fill="#14121b"/>
    <path d="M-36 8-18 18-18 38-36 28Z" fill="#14121b" transform="translate(0 0)"/><path d="M36 8 18 18 18 38 36 28Z" fill="#2c2455"/>
    <circle r="4" cx="0" cy="-31" fill="#ffb454"/>
  </g>
  <!-- pedestal -->
  <g stroke="#b9a8ff" stroke-opacity=".55" fill="#17151f"><path d="M70 196h100l10 14H60Z"/><rect x="56" y="210" width="128" height="14"/><rect x="44" y="224" width="152" height="12"/></g>
  <path d="M60 247h120" stroke="#ffb454" stroke-width="1.5"/>
  <text x="120" y="266" text-anchor="middle" fill="#ebe9f4" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="11" letter-spacing="3.5">FRACTAL PULSE</text>
</svg>

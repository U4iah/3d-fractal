<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fractal Pulse — launch card (design preview)</title>
<style>:root{--fg:#ebe9f4;--dim:#8f8ca8;--accent:#b9a8ff;--signal:#ffb454;--line:rgba(185,168,255,.2)}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b0a10;color:var(--fg);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
.card{width:min(92vw,420px);border:1px solid var(--line);border-radius:16px;background:#0f0e15;overflow:hidden}
.card img{display:block;width:100%;max-height:300px;object-fit:contain;background:#0f0e15}
.meta{padding:12px 16px;display:flex;justify-content:space-between;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
.meta b{color:var(--fg);letter-spacing:.12em}.status{color:var(--signal)}
.entries{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.entries a{padding:14px 4px;text-align:center;color:var(--fg);text-decoration:none;font-size:12px;letter-spacing:.06em;border-right:1px solid var(--line)}.entries a:last-child{border:0}.entries a:hover,.entries a:focus-visible{background:rgba(185,168,255,.14);outline:none}
.note{padding:10px 16px;font-size:11px;color:var(--dim);border-top:1px solid var(--line)}</style></head><body>
<main class="card"><img src="emblem.svg" alt="Fractal Pulse emblem">
<div class="meta"><span><b>SPECIMEN</b> FP·000000 · <span id="spec">current specimen preview slot</span></span><span class="status">● audio idle · not recording</span></div>

<div class="note">Design preview of a possible launch surface. Fractal Pulse is <b>not</b> integrated into the Cathedral or U4 Lab; that is a separate pass (see HOST_INTEGRATION when written).</div></main></body></html>
